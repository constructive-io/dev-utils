# Constructive's pnpm supply-chain policy — the source of truth for every
# Constructive workspace. Regenerate the inventory with `pnpm run refresh`.
#
# This file is data, not code: pnpm-policy (the tool) reads it, and this package
# ships it plus the generated inventory so our repos can point at one pinned
# version instead of each maintaining its own exemption list.

# Third-party releases wait two weeks. Most compromised releases are found and
# yanked well inside that window.
minimumReleaseAge: 14d

# Transitive dependencies must resolve from the registry, not from git or a URL.
blockExoticSubdeps: true

# The npm accounts we publish under. Everything they publish skips the wait, so
# this lists accounts we control — nobody else's.
maintainers:
  - pyramation

# Scopes we own outright, emitted as `@scope/*` so a package published there
# tomorrow is exempt without regenerating. Only add a scope nobody outside
# Constructive can publish into; anything else is listed by name below, which is
# exact because the names come from our own maintainer query.
scopes:
  - "@constructive-io"
  - "@constructive-db"
  - "@launchql"
  - "@pgpm"
  - "@pgpmjs"
  - "@pgsql"
# Also ours, but not claimed as globs yet — their members are listed by name in
# inventory.json, so nothing is un-exempt; claiming one only means future
# packages there skip the wait without a refresh:
#   @agentic-kit  @decryption  @inquirerer  @interweb  @kubernetesjs  @lql-pg

# Generated by `pnpm run refresh`. Committed, and reviewed on every diff: a name
# landing here is a name that stops being quarantined.
inventory: ./inventory.json

# Dependencies allowed to run install scripts. This list is NOT derived from
# anything — an install script is arbitrary code at install time, so each entry
# is a deliberate decision. The value is the reason.
allowBuilds:
  "@google/genai": vendored native deps
  "@launchql/protobufjs": protobuf codegen postinstall
  core-js: polyfill postinstall banner
  electron-winstaller: Windows installer toolchain
  esbuild: native binary, downloaded at install time
  nx: native task-runner binary
  protobufjs: protobuf codegen postinstall
  unrs-resolver: native resolver binary

# Third-party escape hatches. A reason is required; `until` makes the waiver
# expire so `pnpm-policy check` forces a re-justification instead of letting it
# become permanent.
exceptions: []
