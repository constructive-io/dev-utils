server {
    listen 80;

    location = /exact {
        return 200 "exact match";
    }

    location ^~ /prefix {
        return 200 "prefix match";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }

    location ~* \.(jpg|jpeg|png|gif)$ {
        expires 30d;
    }

    location @named {
        internal;
        proxy_pass http://backend;
    }

    location / {
        try_files $uri $uri/ @named;
    }
}
