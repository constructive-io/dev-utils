map $uri $new_uri {
    default "";
    /old-page /new-page;
    /legacy /modern;
}

map $http_user_agent $is_mobile {
    default 0;
    ~*mobile 1;
    ~*android 1;
}

server {
    listen 80;

    if ($new_uri) {
        return 301 $new_uri;
    }

    location / {
        root /var/www/html;
    }
}
